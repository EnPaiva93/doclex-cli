[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docsearch"
version = "0.1.0"
description = "Local document search — BM25 lexical search over PDFs, DOCX, XLSX, CSV, Markdown and TXT files. No embeddings, no vector DB, no cloud."
readme = "README.md"
license = "MIT"
authors = [
    { name = "EnPaiva_93", email = "enpaiva93@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "kreuzberg==4.8.2",
    "bm25x",
    "watchdog",
    "aiosqlite",
    "typer",
]

[project.urls]
Repository = "https://github.com/EnPaiva93/docsearch"

[project.scripts]
docsearch = "docsearch.cli:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ranx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/docsearch"]

[dependency-groups]
dev = [
    "ranx>=0.3.21",
    "tqdm>=4.0",
]
