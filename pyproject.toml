[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doclex-cli"
version = "0.2.1"
description = "Local document search — BM25 lexical search over PDFs, DOCX, XLSX, CSV, Markdown and TXT files. No embeddings, no vector DB, no cloud."
readme = "README.md"
license = "MIT"
authors = [
    { name = "EnPaiva_93", email = "enpaiva93@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "kreuzberg==4.8.2",
    "bm25x",
    "watchdog",
    "aiosqlite",
    "typer",
]

[project.urls]
Repository = "https://github.com/EnPaiva93/doclex-cli"

[project.scripts]
doclex = "doclex.cli:app"

[project.optional-dependencies]
dev = [
    "import-linter>=2.16",
    "pytest",
    "pytest-asyncio",
    "ranx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Architecture contracts, checked by `lint-imports` and by tests/test_architecture.py.
# The engine never knows who its clients are; clients only use the public API in
# doclex/__init__.py; and each layer only reaches down.
[tool.importlinter]
root_package = "doclex"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The engine does not depend on its clients or their UI libraries"
type = "forbidden"
source_modules = [
    "doclex.engine",
    "doclex.pipeline",
    "doclex.results",
    "doclex.registry",
    "doclex.config",
    "doclex.cache",
    "doclex.extraction",
    "doclex.index",
    "doclex.ingestion",
    "doclex.metadata",
    "doclex.segmentation",
]
forbidden_modules = ["doclex.cli", "typer", "rich"]

[[tool.importlinter.contracts]]
name = "The CLI uses only the public API"
type = "forbidden"
source_modules = ["doclex.cli"]
forbidden_modules = [
    "doclex.engine",
    "doclex.pipeline",
    "doclex.results",
    "doclex.registry",
    "doclex.config",
    "doclex.cache",
    "doclex.extraction",
    "doclex.index",
    "doclex.ingestion",
    "doclex.metadata",
    "doclex.segmentation",
]
# The public API re-exports these, so reaching them through `doclex` is the point.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Layers only reach down"
type = "layers"
layers = [
    "doclex.cli",
    "doclex.engine | doclex.results | doclex.registry",
    "doclex.pipeline",
    "doclex.cache | doclex.extraction | doclex.index | doclex.ingestion | doclex.segmentation",
    "doclex.metadata | doclex.config",
]

[tool.hatch.build.targets.wheel]
packages = ["src/doclex"]

[dependency-groups]
dev = [
    "ranx>=0.3.21",
    "tqdm>=4.0",
]
